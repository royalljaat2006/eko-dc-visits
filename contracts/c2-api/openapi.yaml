openapi: 3.1.0
info:
  title: Eko DC Visit Management API
  version: 0.13.0
  description: >
    Contract-first spec (M0 scope). Hand-written; code conforms to this, never the reverse.
    Server validates its own responses against this spec in test mode. All endpoints are
    tenant-scoped via the authenticated principal (ADR-0006). Errors use problem-details.
servers:
  - url: /api/v1
tags:
  - { name: auth, description: OTP enrollment + session (daily entry is local PIN/biometric on-device) }
  - { name: master-data, description: Server→client delta pull (C3 §6) }
  - { name: sync, description: Evidence ingestion (C3) }
  - { name: dashboard, description: Role-scoped reads (C6) }
  - { name: tracking, description: DC live location (derived from track.chunk evidence; never evidence itself, ADR-0003) + smart CSP navigation. Tracked only Check-In→End-Day. Distance is advisory straight-line (ADR-0004/0005), never driving distance/time. }
paths:
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Request an enrollment OTP (SMS via the Eko gateway; the 000000 dev stub is local-development only and disabled in production)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, pattern: '^[6-9][0-9]{9}$' }
      responses:
        '204': { description: OTP dispatched (or stubbed) }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Verify OTP, register/bind device, establish session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp, device]
              properties:
                phone: { type: string }
                otp: { type: string }
                device:
                  type: object
                  required: [hardware]
                  properties:
                    hardware:
                      type: object
                      properties:
                        manufacturer: { type: string }
                        model: { type: string }
                        os_version: { type: string }
                    public_key: { type: string, description: Base64 Keystore public key (recorded in M0, enforced later) }
      responses:
        '200':
          description: Session established; device registered (binding PENDING→BOUND is admin policy; M0 auto-binds)
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, user, device_id]
                properties:
                  access_token: { type: string, description: JWT, ~1h }
                  refresh_token: { type: string, description: Rotating, 30–45d, device-bound }
                  device_id: { type: string, format: uuid }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a fresh access token (v0.9.0). Refresh token is single-use — rotated on every call. A REVOKED device or non-ACTIVE user cannot refresh (HG3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token]
                properties:
                  access_token: { type: string, description: JWT, ~1h }
                  refresh_token: { type: string, description: Rotating, device-bound; the one sent is now invalid }
        '401': { $ref: '#/components/responses/Problem' }
  /master-data/locations:
    get:
      tags: [master-data]
      operationId: listLocations
      summary: Delta-pull location hierarchy (scoped to the caller's territory)
      security: [{ bearer: [] }]
      parameters:
        - { name: updated_since, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 1000 } }
      responses:
        '200':
          description: Locations changed since cursor, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Location' }
                  next_cursor: { type: [string, 'null'], format: date-time }
  /master-data/csp-assignments:
    get:
      tags: [master-data]
      operationId: listCspAssignments
      summary: Delta-pull active CSP assignments (DC gets own; Circle Head gets circle's; design 0001 §5)
      security: [{ bearer: [] }]
      parameters:
        - { name: as_of, in: query, schema: { type: string, format: date }, description: Defaults to today (IST) }
      responses:
        '200':
          description: Active assignments in the caller's scope
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CspAssignment' }
  /master-data/beat-plans:
    get:
      tags: [master-data]
      operationId: getBeatPlans
      summary: DC pulls own beat plans (today + upcoming; pullable from D-1 evening per C3 §6)
      security: [{ bearer: [] }]
      parameters:
        - { name: from_date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Assigned plans
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BeatPlan' }
        '403': { $ref: '#/components/responses/Problem' }
  /sync/batches:
    post:
      tags: [sync]
      operationId: submitSyncBatch
      summary: Submit an evidence batch (C3 §2–3; idempotent at-least-once)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncBatch' }
      responses:
        '200':
          description: Per-op dispositions aligned with ops[]
          content:
            application/json:
              schema:
                type: object
                required: [batch_id, results]
                properties:
                  batch_id: { type: string, format: uuid }
                  results:
                    type: array
                    items:
                      type: object
                      required: [op_id, result]
                      properties:
                        op_id: { type: string, format: uuid }
                        result: { type: string, enum: [accepted, accepted-flagged, duplicate, quarantined, rejected] }
                        flags: { type: array, items: { type: string } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /circle/csp-assignments/transfer:
    post:
      tags: [master-data]
      operationId: transferCspAssignment
      summary: Circle Head assigns/transfers a CSP to a DC in their circle (design 0001 §6; end-old + start-new, never edit history)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csp_location_id, to_dc_user_id, reason]
              properties:
                csp_location_id: { type: string, format: uuid }
                to_dc_user_id: { type: string, format: uuid }
                reason: { type: string, enum: [INITIAL_ALLOCATION, TRANSFER, REBALANCE, COVERAGE_GAP] }
      responses:
        '200':
          description: New active assignment (previous one, if any, ended as of yesterday IST)
          content:
            application/json:
              schema:
                type: object
                required: [assignment]
                properties:
                  assignment: { $ref: '#/components/schemas/CspAssignment' }
                  ended_assignment_id: { type: [string, 'null'], format: uuid }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /dashboard/attendance:
    get:
      tags: [dashboard]
      operationId: listAttendance
      summary: Attendance board (design 0001 §7 — National Head + HR/Admin tenant-wide; Circle Head circle; DC self)
      security: [{ bearer: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date }, description: IST calendar date }
      responses:
        '200':
          description: One row per DC in scope, including DCs with no events (NOT_STARTED)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [dc_user_id, dc_name, status]
                      properties:
                        dc_user_id: { type: string, format: uuid }
                        dc_name: { type: string }
                        status: { type: string, enum: [NOT_STARTED, ON_DUTY, ENDED, AUTO_CLOSED], description: AUTO_CLOSED = no End Day by the 21:00 IST cutoff — "Auto-closed, not confirmed by user" (spec FINALIZED decision) }
                        started_at: { type: [string, 'null'], format: date-time }
                        ended_at: { type: [string, 'null'], format: date-time, description: For AUTO_CLOSED, the 21:00 IST cutoff }
                        auto_closed: { type: boolean }
                        hours_worked: { type: [number, 'null'], description: Check-out − check-in (cutoff-capped when auto-closed), 0.1h resolution }
                        km_today: { type: number, description: Daily distance from GPS track, track_straightline_v0 — PROVISIONAL, never for reimbursement (C7) }
  /dashboard/visits:
    get:
      tags: [dashboard]
      operationId: listVisits
      summary: Role-scoped visits for a date (AM sees assigned DCs; scoping is server-side — clients render what they receive)
      security: [{ bearer: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date }, description: IST calendar date }
      responses:
        '200':
          description: Visits with server-derived geofence results
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Visit' }
  /circle/csp-assignments/import:
    post:
      tags: [master-data]
      operationId: importCspAssignments
      summary: Bulk-assign CSPs to DCs from a spreadsheet (client parses xlsx/csv; rows of csp_code + dc_phone; staged — every row returns accepted or rejected-with-reason)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [csp_code, dc_phone]
                    properties:
                      csp_code: { type: string, description: External CSP code, e.g. CSP-ND-1001 }
                      dc_phone: { type: string, description: Registered DC mobile (10 digits) }
      responses:
        '200':
          description: Per-row dispositions + summary (rows are never silently dropped)
          content:
            application/json:
              schema:
                type: object
                required: [summary, results]
                properties:
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      assigned: { type: integer }
                      transferred: { type: integer }
                      unchanged: { type: integer }
                      rejected: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      required: [row, csp_code, dc_phone, result]
                      properties:
                        row: { type: integer }
                        csp_code: { type: string }
                        dc_phone: { type: string }
                        result: { type: string, enum: [assigned, transferred, unchanged, rejected] }
                        reason: { type: string }
                        dc_name: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
  /circle/csp-details/import:
    post:
      tags: [master-data]
      operationId: importCspDetails
      summary: >
        Circle Head / admin bulk-update of CSP master details (address + spec §3.1 profile fields)
        for CSPs in the caller's own circle (v0.11.0). `dry_run: true` returns the per-row diff
        without writing — the web upload previews that before committing. Whitelist-filtered;
        unlisted fields are ignored, never applied.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                dry_run: { type: boolean, default: false }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [csp_code]
                    additionalProperties: { type: [string, number] }
                    properties:
                      csp_code: { type: string }
      responses:
        '200':
          description: Per-row diff + summary (rows never silently dropped)
          content:
            application/json:
              schema:
                type: object
                required: [summary, results]
                properties:
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      updated: { type: integer }
                      unchanged: { type: integer }
                      rejected: { type: integer }
                      dry_run: { type: boolean }
                  results:
                    type: array
                    items:
                      type: object
                      required: [row, csp_code, result]
                      properties:
                        row: { type: integer }
                        csp_code: { type: string }
                        result: { type: string, enum: [updated, unchanged, rejected] }
                        reason: { type: string }
                        changes:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              old: { type: [string, number, 'null'] }
                              new: { type: [string, number] }
        '403': { $ref: '#/components/responses/Problem' }
  /circle/home-locations/import:
    post:
      tags: [master-data]
      operationId: importHomeLocations
      summary: >
        Circle Head / admin bulk-set of DC + Circle-Head reference home locations
        ("Excel sheet for Lat Long", spec §3). Attendance is LOGGED against home,
        never gated (ADR-0004). A Circle Head may set their own home and their
        circle's DCs'.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [phone, home_lat, home_lng]
                    properties:
                      phone: { type: string, pattern: '^[6-9][0-9]{9}$' }
                      home_lat: { type: number, minimum: -90, maximum: 90 }
                      home_lng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Per-row result + summary
          content:
            application/json:
              schema:
                type: object
                required: [summary, results]
                properties:
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      updated: { type: integer }
                      unchanged: { type: integer }
                      rejected: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      required: [row, phone, result]
                      properties:
                        row: { type: integer }
                        phone: { type: string }
                        result: { type: string, enum: [updated, unchanged, rejected] }
                        reason: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
  /dc/csp-details:
    get:
      tags: [master-data]
      operationId: getDcCspDetails
      summary: DC's assigned CSPs with full details + last-visit date (spec §3 "CSP Details"; Get Directions uses the returned lat/lng)
      security: [{ bearer: [] }]
      responses:
        '200':
          description: One card per assigned CSP, from the same master source as the CSP Workbench
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [csp_location_id, code, name, lat, lng]
                      properties:
                        csp_location_id: { type: string, format: uuid }
                        code: { type: string }
                        name: { type: string }
                        address: { type: string }
                        lat: { type: number }
                        lng: { type: number }
                        coordinate_confidence: { type: string }
                        last_visit_date: { type: [string, 'null'], format: date, description: IST date of this DC's most recent check-in here }
                        csp_profile: { type: object, additionalProperties: { type: string } }
        '403': { $ref: '#/components/responses/Problem' }
  /dc/nearest-csp:
    get:
      tags: [tracking]
      operationId: getNearestCsp
      summary: >
        DC's nearest eligible CSP recommendation for Smart CSP Navigation. Eligibility
        is always the caller's own active CspAssignment set (design 0001 §6), minus
        CSPs already visited today — never a client-supplied list. DC-only (403 for
        other roles). Opening navigation here never auto-completes a visit; check-in
        still requires an actual visit.checkin sync op.
      security: [{ bearer: [] }]
      parameters:
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 }, description: Client-supplied current fix (preferred when present) }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: accuracy_m, in: query, schema: { type: number, minimum: 0 } }
      responses:
        '200':
          description: >
            state reflects why a recommendation may be unavailable: inactive_session
            (not Checked In today, i.e. no open attendance.start), no_eligible_csp
            (every assigned CSP already visited today), no_fix (no query fix and no
            stored live location yet), stale_gps (only a >10min-old stored fix is
            available), ok (fresh fix, items sorted nearest-first).
          content:
            application/json:
              schema:
                type: object
                required: [state, items]
                properties:
                  state: { type: string, enum: [inactive_session, no_eligible_csp, no_fix, stale_gps, ok] }
                  items:
                    type: array
                    items:
                      type: object
                      required: [csp_location_id, code, name, lat, lng]
                      properties:
                        csp_location_id: { type: string, format: uuid }
                        code: { type: string }
                        name: { type: string }
                        address: { type: string }
                        lat: { type: number }
                        lng: { type: number }
                        coordinate_confidence: { type: string }
                        last_visit_date: { type: [string, 'null'], format: date }
                        distance_m: { type: [number, 'null'], description: Straight-line (haversine), same basis as the geofence check (ADR-0004); null when no fix is available }
                        distance_basis: { type: [string, 'null'], enum: [straight_line, null], description: No routing provider is wired (ADR-0005) — never driving distance/time }
        '403': { $ref: '#/components/responses/Problem' }
  /dc/csp-change-requests:
    post:
      tags: [master-data]
      operationId: createCspChangeRequest
      summary: DC proposes edits to an assigned CSP (pending until Circle Head/Admin approval — spec §3)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csp_location_id, changes]
              properties:
                csp_location_id: { type: string, format: uuid }
                changes:
                  type: object
                  minProperties: 1
                  description: field -> proposed value; whitelisted fields only
                  additionalProperties: { type: [string, number] }
      responses:
        '200':
          description: Pending request recorded with old-value snapshot
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request: { $ref: '#/components/schemas/CspChangeRequest' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /circle/csp-change-requests:
    get:
      tags: [master-data]
      operationId: listCspChangeRequests
      summary: Circle Head approval queue (own circle's DCs; Admin tenant-wide) — old vs proposed side-by-side
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
      responses:
        '200':
          description: Change requests joined with CSP + requester names
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/CspChangeRequest' }
                        - type: object
                          properties:
                            csp_code: { type: string }
                            csp_name: { type: string }
                            requested_by_name: { type: string }
  /circle/csp-change-requests/decide:
    post:
      tags: [master-data]
      operationId: decideCspChangeRequest
      summary: Approve (applies the edit to the CSP master) or reject with a reason sent back to the DC
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, decision]
              properties:
                id: { type: string, format: uuid }
                decision: { type: string, enum: [APPROVED, REJECTED] }
                rejection_reason: { type: string }
      responses:
        '200':
          description: Decided request (approval has already updated the location master)
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request: { $ref: '#/components/schemas/CspChangeRequest' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /dashboard/overview:
    get:
      tags: [dashboard]
      operationId: getOverview
      summary: Admin cockpit — every headline data point in one payload (CORPORATE_ADMIN + NATIONAL_HEAD only)
      security: [{ bearer: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date }, description: IST calendar date }
      responses:
        '200':
          description: Tenant-wide rollups (attendance, visits, CSP coverage, circles, banks, per-DC)
          content:
            application/json:
              schema:
                type: object
                required: [date, attendance, visits, csps, circles, banks, assignments_by_dc]
                properties:
                  date: { type: string, format: date }
                  attendance:
                    type: object
                    properties:
                      total_dcs: { type: integer }
                      on_duty: { type: integer }
                      ended: { type: integer }
                      not_started: { type: integer }
                  visits:
                    type: object
                    properties:
                      total: { type: integer }
                      geo_verified: { type: integer }
                      flagged: { type: integer }
                      late_sync: { type: integer }
                      unplanned: { type: integer }
                  csps:
                    type: object
                    properties:
                      total: { type: integer }
                      assigned: { type: integer }
                      unassigned: { type: integer }
                      coordinates_unverified: { type: integer }
                  circles:
                    type: array
                    items:
                      type: object
                      properties:
                        circle_id: { type: string, format: uuid }
                        circle_name: { type: string }
                        circle_head: { type: [string, 'null'] }
                        dc_count: { type: integer }
                        on_duty: { type: integer }
                        csp_count: { type: integer }
                        visits_today: { type: integer }
                        flagged_today: { type: integer }
                  banks:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        code: { type: string }
                        status: { type: string }
                        csp_count: { type: integer }
                  assignments_by_dc:
                    type: array
                    items:
                      type: object
                      properties:
                        dc_user_id: { type: string, format: uuid }
                        dc_name: { type: string }
                        csp_count: { type: integer }
                        attendance: { type: string, enum: [NOT_STARTED, ON_DUTY, ENDED] }
                        visits_today: { type: integer }
                        km_today: { type: number, description: PROVISIONAL daily km (track_straightline_v0) }
        '403': { $ref: '#/components/responses/Problem' }
  /dashboard/csps:
    get:
      tags: [dashboard, master-data]
      operationId: listDashboardCsps
      summary: >
        Admin Portal "All CSPs": every CSP in the caller's scope (C6), ordered as in
        Eko's calling sheet (sheet_row ascending; CSPs not from the sheet come last,
        by code). CSP operators are anonymous (the CSP code is the only identity);
        the assigned DC is a named Eko official, so DC name + phone are returned.
        CORPORATE_ADMIN, NATIONAL_HEAD (tenant-wide) and CIRCLE_HEAD (own circle);
        403 for DC and HR_ADMIN.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: One row per CSP. address is null until the sheet (or an approved DC edit) provides it.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [csp_location_id, code]
                      properties:
                        csp_location_id: { type: string, format: uuid }
                        code: { type: string }
                        address: { type: [string, 'null'] }
                        district: { type: [string, 'null'] }
                        state: { type: [string, 'null'] }
                        circle: { type: [string, 'null'] }
                        population: { type: [string, 'null'], description: Rural / Semi-urban / Urban as in the sheet }
                        dc_user_id: { type: [string, 'null'], format: uuid }
                        dc_name: { type: [string, 'null'] }
                        dc_phone: { type: [string, 'null'] }
                        sheet_row: { type: [integer, 'null'], description: 1-based data-row number in the calling sheet }
        '403': { $ref: '#/components/responses/Problem' }
  /dashboard/live-locations:
    get:
      tags: [tracking, dashboard]
      operationId: listLiveLocations
      summary: >
        Live map feed (Admin Portal): one row per DC in the caller's scope (C6),
        with the freshest known position derived from track.chunk evidence (never
        evidence itself — a pure, overwritable projection, ADR-0003). Polling, not
        a push stream, consistent with the rest of this dashboard (10s poll on
        /dashboard/visits).
      security: [{ bearer: [] }]
      parameters:
        - { name: stale_after_s, in: query, schema: { type: integer, minimum: 1, default: 60 }, description: Age threshold for the `stale` state }
      responses:
        '200':
          description: state = no_fix (never reported a position) | off_duty (has a position, not currently On Duty) | stale (On Duty, last fix older than stale_after_s) | live
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [dc_user_id, name, on_duty, state]
                      properties:
                        dc_user_id: { type: string, format: uuid }
                        name: { type: string }
                        on_duty: { type: boolean }
                        state: { type: string, enum: [no_fix, off_duty, stale, live] }
                        lat: { type: number }
                        lng: { type: number }
                        accuracy_m: { type: [number, 'null'] }
                        captured_at: { type: string, format: date-time, description: Device wall time of the freshest fix (absent when state is no_fix) }
  /dashboard/route-history:
    get:
      tags: [tracking, dashboard]
      operationId: getRouteHistory
      summary: >
        One DC's raw GPS track for one IST calendar date (bounded query backing the
        Admin Portal's route-history view), read straight from track.chunk evidence
        via the same path DC-side daily-km derivation uses. Scope-checked: the
        caller's resolved Scope (C6/ADR-0006) must include dc_user_id, else 403.
      security: [{ bearer: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date }, description: IST calendar date }
        - { name: dc_user_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Points as stored (unsorted by this endpoint; sort by t client-side, matching the order-independent convergence invariant, C3 §3)
          content:
            application/json:
              schema:
                type: object
                required: [dc_user_id, date, points]
                properties:
                  dc_user_id: { type: string, format: uuid }
                  date: { type: string, format: date }
                  points:
                    type: array
                    items:
                      type: object
                      required: [lat, lng, t]
                      properties:
                        lat: { type: number, minimum: -90, maximum: 90 }
                        lng: { type: number, minimum: -180, maximum: 180 }
                        t: { type: string, format: date-time }
                        accuracy_m: { type: number, minimum: 0 }
                        is_mock: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /dashboard/scorecard:
    get:
      tags: [dashboard]
      operationId: listScorecards
      summary: Gamified DC scorecards per dc_score_v1 (design 0002; self-view parity — DC self, CH circle, NH tenant)
      security: [{ bearer: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date }, description: IST calendar date }
      responses:
        '200':
          description: One card per DC in scope, formula-transparent
          content:
            application/json:
              schema:
                type: object
                required: [formula_version, items]
                properties:
                  formula_version: { type: string, enum: [dc_score_v1] }
                  items:
                    type: array
                    items:
                      type: object
                      required: [dc_user_id, dc_name, points, visits_done, geo_verified_visits, on_time_start, streak_days, badges]
                      properties:
                        dc_user_id: { type: string, format: uuid }
                        dc_name: { type: string }
                        points: { type: integer }
                        visits_done: { type: integer }
                        geo_verified_visits: { type: integer }
                        on_time_start: { type: boolean }
                        started_at: { type: [string, 'null'], format: date-time }
                        streak_days: { type: integer }
                        badges: { type: array, items: { type: string, enum: [EARLY_BIRD, PERFECT_DAY, STREAK_3, STREAK_7] } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Problem-details error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Backoff requested (C3 §3); client honors Retry-After
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    User: { $ref: '../c1-entities/user-device.schema.json#/$defs/user' }
    CspAssignment: { $ref: '../c1-entities/csp-assignment.schema.json' }
    CspChangeRequest: { $ref: '../c1-entities/csp-change-request.schema.json' }
    Location: { $ref: '../c1-entities/location.schema.json' }
    BeatPlan: { $ref: '../c1-entities/beat-plan.schema.json' }
    CheckInEvent: { $ref: '../c1-entities/checkin-event.schema.json' }
    SyncBatch:
      type: object
      required: [batch_id, device_id, seq_from, seq_to, client_time, app_version, contract_version, ops]
      properties:
        batch_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        seq_from: { type: integer, minimum: 0 }
        seq_to: { type: integer, minimum: 0 }
        client_time: { type: string, format: date-time }
        app_version: { type: string }
        contract_version: { type: string }
        queue_depth_by_tier:
          type: object
          properties:
            t1: { type: integer }
            t2: { type: integer }
            t3: { type: integer }
            t4: { type: integer }
        oldest_unsynced_age_s: { type: integer }
        health:
          type: object
          properties:
            battery_pct: { type: integer, minimum: 0, maximum: 100 }
            network: { type: string }
            storage_free_mb: { type: integer }
        ops:
          type: array
          minItems: 1
          items:
            type: object
            required: [op_id, seq, type, payload]
            properties:
              op_id: { type: string, format: uuid }
              seq: { type: integer, minimum: 0 }
              type: { type: string, enum: [visit.checkin, visit.checkout, visit.photo, attendance.start, attendance.end, track.chunk] }
              payload: { $ref: '#/components/schemas/CheckInEvent' }
        signature: { type: string }
    Visit:
      type: object
      description: Server read model derived from evidence events; events themselves are never mutated.
      required: [id, dc_user_id, location_id, checkin, geofence_result, sync_state]
      properties:
        id: { type: string, format: uuid }
        dc_user_id: { type: string, format: uuid }
        dc_name: { type: string }
        location_id: { type: string, format: uuid }
        location_name: { type: string }
        location_code: { type: string }
        planned: { type: boolean }
        checkin:
          type: object
          required: [occurred_at, fix]
          properties:
            occurred_at: { type: string, format: date-time, description: device_wall_time; server_received_at available to auditors }
            server_received_at: { type: string, format: date-time }
            fix: { $ref: '../c1-entities/common.schema.json#/$defs/geoPoint' }
        distance_from_master_m: { type: number }
        geofence_result: { type: string, enum: [INSIDE, OUTSIDE_FLAGGED], description: Advisory (ADR-0004); computed against effective radius = radius_m + accuracy_m }
        out_of_radius_reason: { type: [string, 'null'] }
        sync_state: { type: string, enum: [SYNCED, LATE_SYNC] }
        photo_count: { type: integer, description: Count of visit.photo evidence linked to this visit (v0.9.0; derived at read time). }
        checked_out_at: { type: [string, 'null'], format: date-time, description: Earliest visit.checkout event's device_wall_time for this visit (v0.10.0; derived at read time; null while open). }
        duration_minutes: { type: [integer, 'null'], description: checked_out_at minus the check-in occurred_at, in whole minutes; null while open. }

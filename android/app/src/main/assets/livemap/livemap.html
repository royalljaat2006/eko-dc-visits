<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<style>/*LEAFLET_CSS*/</style>
<style>
  html, body, #map { margin: 0; height: 100%; width: 100%; background: #f4efe6; }
</style>
</head>
<body>
<div id="map"></div>
<div id="err" style="display:none;position:absolute;top:0;left:0;right:0;padding:8px;font:12px sans-serif;color:#b00020;background:#fff8;z-index:2000"></div>
<script>
  // A blank map gives the admin nothing to report; show the script error instead.
  window.onerror = function (msg, src, line) {
    var e = document.getElementById('err');
    e.style.display = 'block';
    e.textContent += 'Map error: ' + msg + ' (line ' + line + ')\n';
  };
</script>
<script>/*LEAFLET_JS*/</script>
<script>
  // Admin Live Map (same look as the web dashboard's Live Tracking): one circle per DC,
  // coloured by state. LiveMapScreen pushes rows in with setDcs(); nothing is fetched here.
  var COLOR = { live: '#1d7a3a', stale: '#d9860a', off_duty: '#5d564a', no_fix: '#5d564a' };
  var map = L.map('map', { zoomControl: true }).setView([22.97, 78.65], 5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);
  var layer = L.layerGroup().addTo(map);
  var routeLayer = L.layerGroup().addTo(map);
  var byId = {};
  var fitted = false;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // The WebView can load before Compose gives it a size; Leaflet then sees a 0x0
  // map and draws nothing until told the size changed.
  window.addEventListener('resize', function () { map.invalidateSize(); });

  window.setDcs = function (rows, selectedId) {
    map.invalidateSize();
    layer.clearLayers();
    byId = {};
    var points = [];
    rows.forEach(function (r) {
      var sel = r.id === selectedId;
      var m = L.circleMarker([r.lat, r.lng], {
        radius: sel ? 11 : 8,
        color: COLOR[r.state] || COLOR.no_fix,
        fillColor: COLOR[r.state] || COLOR.no_fix,
        fillOpacity: r.state === 'live' ? 0.9 : 0.5,
        weight: sel ? 3 : 2,
      }).bindPopup('<strong>' + esc(r.name) + '</strong><br>' + esc(r.label)).addTo(layer);
      byId[r.id] = m;
      points.push([r.lat, r.lng]);
    });
    if (points.length > 0 && !fitted && map.getSize().y > 0) {
      map.fitBounds(L.latLngBounds(points).pad(0.2), { maxZoom: 15 });
      fitted = true;
    }
  };

  // Today's route for the picked DC: a blue line from first to latest point.
  window.setRoute = function (points) {
    routeLayer.clearLayers();
    if (!points || points.length < 2) return;
    var line = L.polyline(points, { color: '#17346E', weight: 4, opacity: 0.8 }).addTo(routeLayer);
    L.circleMarker(points[0], { radius: 6, color: '#17346E', fillColor: '#fff', fillOpacity: 1, weight: 2 })
      .bindPopup('Start').addTo(routeLayer);
    map.fitBounds(line.getBounds().pad(0.2), { maxZoom: 16 });
  };

  window.focusDc = function (id) {
    var m = byId[id];
    if (!m) return;
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 14));
    m.openPopup();
  };
</script>
</body>
</html>

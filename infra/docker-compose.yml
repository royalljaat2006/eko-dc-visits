# Dev stack (M0). Backend tests also run without Docker via the in-memory store (ADR-0009).
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: dcvisits
      POSTGRES_USER: dcvisits
      POSTGRES_PASSWORD: dcvisits_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dcvisits"], interval: 5s, retries: 10 }
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: dev, MINIO_ROOT_PASSWORD: dev_dev_dev }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes: { pgdata: {}, miniodata: {} }
